
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">
    <h1>🤖 AI Chatbot</h1>
    <p>Your intelligent AI assistant</p>

    <div id="chatbox"></div>

    <div class="input-area">
        <input type="text" id="message" placeholder="Ask me anything..." maxlength="500">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById("message");
    const chatbox = document.getElementById("chatbox");
    const message = input.value.trim();

    if (!message) {
        alert("Please enter a message!");
        return;
    }

    chatbox.innerHTML += `<div class="user">You: ${escapeHTML(message)}</div>`;
    input.value = "";

    const loading = document.createElement("div");
    loading.className = "bot";
    loading.textContent = "AI is thinking...";
    chatbox.appendChild(loading);

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({message: message})
        });

        const data = await response.json();
        loading.textContent = "AI: " + (data.response || data.error);

    } catch (error) {
        loading.textContent = "Error connecting to server!";
    }

    chatbox.scrollTop = chatbox.scrollHeight;
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

document.getElementById("message").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
